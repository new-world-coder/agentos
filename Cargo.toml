[workspace]
resolver = "2"
members = [
    "crates/oasis-core",
    "crates/oasis-store",
    "crates/oasis-provider",
    "crates/oasis-tools",
    "crates/oasis-policy",
    "crates/oasis-runtime",
    "crates/oasis-api",
    "crates/oasis-cli",
]
default-members = [
    "crates/oasis-cli",
    "crates/oasis-api",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Oasis Contributors"]
repository = "https://github.com/new-world-coder/oasis"
rust-version = "1.85"

[workspace.dependencies]
oasis-core = { path = "crates/oasis-core" }
oasis-store = { path = "crates/oasis-store" }
oasis-provider = { path = "crates/oasis-provider" }
oasis-tools = { path = "crates/oasis-tools" }
oasis-policy = { path = "crates/oasis-policy" }
oasis-runtime = { path = "crates/oasis-runtime" }
oasis-api = { path = "crates/oasis-api" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
