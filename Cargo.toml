[workspace]
resolver = "2"
members = [
    "crates/agentos-core",
    "crates/agentos-store",
    "crates/agentos-provider",
    "crates/agentos-tools",
    "crates/agentos-policy",
    "crates/agentos-runtime",
    "crates/agentos-api",
    "crates/agentos-cli",
]
default-members = [
    "crates/agentos-cli",
    "crates/agentos-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AgentOS Contributors"]
repository = "https://github.com/new-world-coder/agentos"
rust-version = "1.85"

[workspace.dependencies]
agentos-core = { path = "crates/agentos-core" }
agentos-store = { path = "crates/agentos-store" }
agentos-provider = { path = "crates/agentos-provider" }
agentos-tools = { path = "crates/agentos-tools" }
agentos-policy = { path = "crates/agentos-policy" }
agentos-runtime = { path = "crates/agentos-runtime" }
agentos-api = { path = "crates/agentos-api" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
